# Include inside this domain's existing HTTPS server block only.
# Keep its Certbot certificate lines and all other locations unchanged.
# Staged rollout: deploy the sign-in capable release behind the old gate, configure auth,
# then install this session snippet with setup and verify before retiring the old credentials.
location = /backstage { return 308 /backstage/; }
location = /backstage/sign-in {
    proxy_pass http://127.0.0.1:3456/backstage/sign-in;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 16k;
}
location = /api/auth/password {
    proxy_pass http://127.0.0.1:3456/api/auth/password;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 16k;
}
location = /api/auth/sign-out {
    proxy_pass http://127.0.0.1:3456/api/auth/sign-out;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 16k;
}
location = /api/auth/google {
    proxy_pass http://127.0.0.1:3456/api/auth/google;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 16k;
}
location = /api/auth/google/callback {
    proxy_pass http://127.0.0.1:3456/api/auth/google/callback;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 16k;
    access_log off;
}
location = /_backstage_session {
    internal;
    proxy_pass http://127.0.0.1:3456/api/auth/session;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
    proxy_intercept_errors on;
    error_page 403 404 500 502 503 504 =401 @backstage_deny;
}
location ^~ /backstage/ {
    auth_request /_backstage_session;
    error_page 401 = @backstage_sign_in;
    proxy_set_header X-Backstage-Gate session;
    proxy_pass http://127.0.0.1:3456;
    proxy_set_header Host $host;
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    proxy_read_timeout 40s;
}
location ^~ /api/backstage/ {
    auth_request /_backstage_session;
    error_page 401 = @backstage_api_401;
    proxy_set_header X-Backstage-Gate session;
    # Overwrite any visitor-supplied header; backend trusts only configured loopback proxy.
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 64k;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:3456;
    proxy_set_header Host $host;
    proxy_read_timeout 40s;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
}
location @backstage_deny { return 401; }
location @backstage_sign_in { absolute_redirect off; return 302 /backstage/sign-in?next=$request_uri; }
location @backstage_api_401 {
    default_type application/json;
    return 401 '{"code":"unauthenticated"}';
}
