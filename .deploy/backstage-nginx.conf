# Include inside this domain's existing HTTPS server block only.
# Keep its Certbot certificate lines and all other locations unchanged.
location = /backstage { return 308 /backstage/; }
location ^~ /backstage/ {
    proxy_pass http://127.0.0.1:3456;
    proxy_set_header Host $host;
    proxy_read_timeout 40s;
}
location ^~ /api/backstage/ {
    # Overwrite any visitor-supplied header; backend trusts only configured loopback proxy.
    proxy_set_header X-Backstage-Client-IP $remote_addr;
    client_max_body_size 64k;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:3456;
    proxy_set_header Host $host;
    proxy_read_timeout 40s;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
}
