# nginx vhost for jevnotjev.breakoutwithai.com (static site, no proxy)
#
# Installed ONCE by .deploy/provision.sh as a NEW file at
# /etc/nginx/sites-available/jevnotjev.breakoutwithai.com, symlinked into sites-enabled.
# This host serves other tenants: never edit another vhost, never `restart` nginx
# (`nginx -t` then `reload` only).
#
# This committed file is the HTTP-only SOURCE. `certbot --nginx` then rewrites the live file
# to add the :443 block and the :80 redirect. deploy.sh never touches this vhost; it swaps the
# /var/www/jevnotjev symlink underneath it.

server {
    listen 80;
    listen [::]:80;
    server_name jevnotjev.breakoutwithai.com;

    # A symlink into /var/www/jevnotjev-releases/<id>, swapped atomically by deploy.sh.
    root /var/www/jevnotjev;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME HTTP-01 for renewals. ^~ so the dotfile deny below cannot shadow it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The deploy check reads this to prove WHICH release is live. Never cached.
    location = /DEPLOYED_SHA {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # No dotfiles (.git, .env) even if one were ever shipped by mistake. Listed before the
    # image regex: regex locations match in file order, so /.x.png must hit this first.
    location ~ /\. {
        deny all;
    }

    # Images are not fingerprinted but change rarely: one day.
    location ~* \.(png|jpe?g|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML and data.js are not fingerprinted: revalidate every time so a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/jevnotjev.access.log;
    error_log  /var/log/nginx/jevnotjev.error.log;
}
